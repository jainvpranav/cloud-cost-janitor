name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Unit tests
        run: pytest backend/tests -q

      - name: Lint CloudFormation
        run: cfn-lint infrastructure/*.yaml infrastructure/demo/*.yaml

      - name: Package Lambdas
        run: ./scripts/package_lambdas.sh

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is written by npm 11 on developer machines; npm 10 (bundled with
      # Node 20) resolves optional peer deps differently and rejects it as out of sync.
      - name: Install
        working-directory: frontend
        run: |
          npm install -g npm@11
          npm ci

      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: https://api.example.com/prod
