<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Cloud Cost Janitor — continuously discover, review and eliminate idle AWS infrastructure."
    />
    <title>Cloud Cost Janitor</title>
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var mode = localStorage.getItem('ccj.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* keep the light default */
        }
      })();
    </script>
    <style>
      /* Pre-hydration reset. Real styling lives in src/index.css. */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #root { min-height: 100vh; }
      .boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; font-size: 13px; color: #79839a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .boot .ring {
        width: 26px; height: 26px; border: 2.5px solid #e3e7ed; border-top-color: #4a5bd6;
        border-radius: 50%; animation: bootspin 700ms linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 40px; font-family: sans-serif">
        Cloud Cost Janitor requires JavaScript to run.
      </div>
    </noscript>
    <div id="root">
      <div class="boot"><div class="ring"></div>Loading Cloud Cost Janitor…</div>
    </div>
  </body>
</html>
