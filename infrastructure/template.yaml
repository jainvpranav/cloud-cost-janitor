AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cloud Cost Janitor - idle resource scanner, MCP endpoint for agents, approval API and dashboard'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Only needed when EnrichmentEnabled is true
  FrontendBucketName:
    Type: String
    Description: Globally unique S3 bucket name for the dashboard
  NotificationEmail:
    Type: String
    Description: Email for approval notifications
  EnrichmentEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Call the OpenAI enrichment Lambda after each scan. The TrueForge agent replaces it.
  TeardownScopeTagValue:
    Type: String
    Default: demo
    Description: When set, teardown can only delete resources tagged CostJanitor=<value>. Empty allows any resource.

Conditions:
  ScopeTeardown: !Not [!Equals [!Ref TeardownScopeTagValue, '']]

Resources:
  # ============================================================
  # DYNAMODB TABLES
  # ============================================================
  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-findings
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: account-index
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ApprovalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-approvals
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: approval_id
          AttributeType: S
        - AttributeName: finding_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: approval_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: finding-index
          KeySchema:
            - AttributeName: finding_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-config
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH

  PromptRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-prompts
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: model_name
          AttributeType: S
        - AttributeName: version
          AttributeType: S
      KeySchema:
        - AttributeName: model_name
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE

  # Background scan and teardown jobs, so the agent and the dashboard can poll progress.
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-jobs
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # One row per agent tool call or dashboard action: the live feed and the audit trail.
  ActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-activity
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================================
  # SNS
  # ============================================================
  ApprovalNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-approvals
      DisplayName: Cost Janitor Approval Notifications

  ApprovalNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ApprovalNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ============================================================
  # IAM ROLES
  # ============================================================
  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-scanner
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScannerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - autoscaling:DescribeAutoScalingGroups
                  - pricing:GetProducts
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt FindingsTable.Arn
                  - !Sub ${FindingsTable.Arn}/index/*
                  - !GetAtt ConfigTable.Arn
                  - !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt EnrichmentFunction.Arn
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: "*"
                Condition:
                  StringEquals:
                    sts:ExternalId: !Sub cost-janitor-${Environment}

  EnrichmentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-enrichment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EnrichmentPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FindingsTable.Arn
                  - !GetAtt ApprovalsTable.Arn
                  - !GetAtt PromptRegistryTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ApprovalNotificationTopic

  TeardownRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-teardown
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TeardownPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only checks before deleting: live tags, still idle, snapshot progress.
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateSnapshot
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub arn:${AWS::Partition}:ec2:*::snapshot/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSnapshot
              - !If
                - ScopeTeardown
                - Effect: Allow
                  Action:
                    - ec2:TerminateInstances
                    - ec2:DeleteVolume
                    - elasticloadbalancing:DeleteLoadBalancer
                  Resource: "*"
                  Condition:
                    StringEquals:
                      aws:ResourceTag/CostJanitor: !Ref TeardownScopeTagValue
                - Effect: Allow
                  Action:
                    - ec2:TerminateInstances
                    - ec2:DeleteVolume
                    - elasticloadbalancing:DeleteLoadBalancer
                  Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FindingsTable.Arn
                  - !GetAtt ApprovalsTable.Arn
                  - !GetAtt ConfigTable.Arn
                  - !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: "*"
                Condition:
                  StringEquals:
                    sts:ExternalId: !Sub cost-janitor-${Environment}

  # Execution role for the API Lambda (it previously trusted API Gateway, which Lambda cannot assume).
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt FindingsTable.Arn
                  - !Sub ${FindingsTable.Arn}/index/*
                  - !GetAtt ApprovalsTable.Arn
                  - !Sub ${ApprovalsTable.Arn}/index/*
                  - !GetAtt ConfigTable.Arn
                  - !GetAtt JobsTable.Arn
                  - !GetAtt ActivityTable.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TeardownFunction.Arn
                  - !GetAtt ScannerFunction.Arn

  McpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-mcp
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: McpPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt FindingsTable.Arn
                  - !Sub ${FindingsTable.Arn}/index/*
                  - !GetAtt ApprovalsTable.Arn
                  - !Sub ${ApprovalsTable.Arn}/index/*
                  - !GetAtt ConfigTable.Arn
                  - !GetAtt JobsTable.Arn
                  - !GetAtt ActivityTable.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ScannerFunction.Arn
                  - !GetAtt TeardownFunction.Arn

  # ============================================================
  # LOG GROUPS (7-day retention keeps CloudWatch cost near zero)
  # ============================================================
  ScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-scanner
      RetentionInDays: 7

  EnrichmentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-enrichment
      RetentionInDays: 7

  TeardownLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-teardown
      RetentionInDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 7

  McpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-mcp
      RetentionInDays: 7

  # ============================================================
  # LAMBDA FUNCTIONS (code is uploaded by CI after the stack deploys)
  # ============================================================
  ScannerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ScannerLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-scanner
      Runtime: python3.11
      Handler: lambda_function.handler
      Role: !GetAtt ScannerRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          CONFIG_TABLE: !Ref ConfigTable
          JOBS_TABLE: !Ref JobsTable
          ENRICHMENT_FUNCTION: !Ref EnrichmentFunction
          ENRICHMENT_ENABLED: !Ref EnrichmentEnabled
          ENVIRONMENT: !Ref Environment
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          # Placeholder - replaced by CI/CD
          def handler(event, context):
              return {"statusCode": 200, "body": "Scanner not deployed yet"}

  EnrichmentFunction:
    Type: AWS::Lambda::Function
    DependsOn: EnrichmentLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-enrichment
      Runtime: python3.11
      Handler: lambda_function.handler
      Role: !GetAtt EnrichmentRole.Arn
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          APPROVALS_TABLE: !Ref ApprovalsTable
          PROMPT_REGISTRY_TABLE: !Ref PromptRegistryTable
          APPROVAL_TOPIC_ARN: !Ref ApprovalNotificationTopic
          OPENAI_API_KEY: !Ref OpenAIApiKey
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          # Placeholder - replaced by CI/CD
          def handler(event, context):
              return {"statusCode": 200, "body": "Enrichment not deployed yet"}

  TeardownFunction:
    Type: AWS::Lambda::Function
    DependsOn: TeardownLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-teardown
      Runtime: python3.11
      Handler: lambda_function.handler
      Role: !GetAtt TeardownRole.Arn
      # EBS teardown waits for the pre-delete snapshot to complete.
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          APPROVALS_TABLE: !Ref ApprovalsTable
          CONFIG_TABLE: !Ref ConfigTable
          JOBS_TABLE: !Ref JobsTable
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          # Placeholder - replaced by CI/CD
          def handler(event, context):
              return {"statusCode": 200, "body": "Teardown not deployed yet"}

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Runtime: python3.11
      Handler: api.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          APPROVALS_TABLE: !Ref ApprovalsTable
          CONFIG_TABLE: !Ref ConfigTable
          JOBS_TABLE: !Ref JobsTable
          ACTIVITY_TABLE: !Ref ActivityTable
          TEARDOWN_FUNCTION: !Ref TeardownFunction
          SCANNER_FUNCTION: !Ref ScannerFunction
          ENVIRONMENT: !Ref Environment
          # Comma-separated. The first entry is used when the request Origin is not in the list.
          ALLOWED_ORIGIN: !Sub https://${CloudFrontDistribution.DomainName},http://localhost:3000
      Code:
        ZipFile: |
          # Placeholder - replaced by CI/CD
          def handler(event, context):
              return {"statusCode": 200, "body": "API not deployed yet"}

  McpFunction:
    Type: AWS::Lambda::Function
    DependsOn: McpLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-mcp
      Runtime: python3.11
      Handler: lambda_function.handler
      Role: !GetAtt McpRole.Arn
      # API Gateway cuts requests off at 29 seconds; long work runs as background jobs.
      Timeout: 28
      MemorySize: 512
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          APPROVALS_TABLE: !Ref ApprovalsTable
          CONFIG_TABLE: !Ref ConfigTable
          JOBS_TABLE: !Ref JobsTable
          ACTIVITY_TABLE: !Ref ActivityTable
          SCANNER_FUNCTION: !Ref ScannerFunction
          TEARDOWN_FUNCTION: !Ref TeardownFunction
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          # Placeholder - replaced by CI/CD
          def handler(event, context):
              return {"statusCode": 503, "body": "MCP server not deployed yet"}

  # ============================================================
  # API GATEWAY
  # ============================================================
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-api
      Description: Cost Janitor API and MCP endpoint
      EndpointConfiguration:
        Types: [REGIONAL]

  # Errors produced by API Gateway itself (throttling, unknown route, Lambda crash or timeout)
  # never reach the Lambda, so they need CORS headers here or the browser hides the real error.
  GatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${CloudFrontDistribution.DomainName}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  GatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${CloudFrontDistribution.DomainName}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # --- /findings ---------------------------------------------------------
  FindingsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: findings

  FindingsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref FindingsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # API Gateway rejects OPTIONS on a resource without an OPTIONS method, so each
  # browser-facing resource has one. The Lambda answers the preflight.
  FindingsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref FindingsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  FindingByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref FindingsResource
      PathPart: "{finding_id}"

  FindingByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref FindingByIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  FindingByIdOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref FindingByIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /approvals --------------------------------------------------------
  ApprovalsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: approvals

  ApprovalsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApprovalsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ApprovalsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApprovalsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ApprovalByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ApprovalsResource
      PathPart: "{approval_id}"

  ApprovalVoteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ApprovalByIdResource
      PathPart: vote

  ApprovalVoteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApprovalVoteResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ApprovalVoteOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApprovalVoteResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /teardown ---------------------------------------------------------
  TeardownResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: teardown

  TeardownMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TeardownResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  TeardownOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TeardownResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /config -----------------------------------------------------------
  ConfigResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: config

  ConfigMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ConfigResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ConfigOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ConfigResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /scan -------------------------------------------------------------
  ScanResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: scan

  ScanMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ScanResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ScanOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ScanResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /jobs/{job_id} ----------------------------------------------------
  JobsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: jobs

  JobByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref JobsResource
      PathPart: "{job_id}"

  JobByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref JobByIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  JobByIdOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref JobByIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /activity ---------------------------------------------------------
  ActivityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: activity

  ActivityMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ActivityResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ActivityOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ActivityResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # --- /mcp (agents only; API key required, no browser access) -----------
  McpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: mcp

  McpMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref McpResource
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpFunction.Arn}/invocations

  # A deployment must be created after every method exists, or the first deploy fails with
  # "The REST API doesn't contain any methods". CI also calls create-deployment on every push
  # so route changes go live without renaming this resource.
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - FindingsMethod
      - FindingsOptionsMethod
      - FindingByIdMethod
      - FindingByIdOptionsMethod
      - ApprovalsMethod
      - ApprovalsOptionsMethod
      - ApprovalVoteMethod
      - ApprovalVoteOptionsMethod
      - TeardownMethod
      - TeardownOptionsMethod
      - ConfigMethod
      - ConfigOptionsMethod
      - ScanMethod
      - ScanOptionsMethod
      - JobByIdMethod
      - JobByIdOptionsMethod
      - ActivityMethod
      - ActivityOptionsMethod
      - McpMethod
    Properties:
      RestApiId: !Ref ApiGateway
      Description: Initial deployment; CI redeploys the stage on every push

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

  McpApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub ${AWS::StackName}-mcp
      Description: Key for the TrueForge agent to call /mcp
      Enabled: true

  McpUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub ${AWS::StackName}-mcp
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: !Ref ApiStage
      Throttle:
        RateLimit: 20
        BurstLimit: 40
      Quota:
        Limit: 10000
        Period: DAY

  McpUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref McpApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref McpUsagePlan

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/*

  McpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/mcp

  # ============================================================
  # EVENTBRIDGE RULE (Daily Scan)
  # ============================================================
  DailyScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-daily-scan
      Description: Daily cost janitor scan at 6 AM UTC
      ScheduleExpression: "cron(0 6 * * ? *)"
      State: ENABLED
      Targets:
        - Id: ScannerFunction
          Arn: !GetAtt ScannerFunction.Arn

  ScannerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScannerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyScanRule.Arn

  # ============================================================
  # FRONTEND HOSTING (S3 + CloudFront)
  # ============================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub cost-janitor-oai-${Environment}

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub cost-janitor-frontend-${Environment}
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_100
        # Client-side routes (/approvals, /settings, ...) are not files in S3.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiEndpoint:
    Description: API Gateway stage URL (REACT_APP_API_URL)
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiId:
    Description: REST API id
    Value: !Ref ApiGateway
  McpEndpoint:
    Description: MCP server URL for the TrueForge agent (send the API key as x-api-key)
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/mcp
  McpApiKeyId:
    Description: Read the key value with aws apigateway get-api-key --api-key <id> --include-value
    Value: !Ref McpApiKey
  FrontendUrl:
    Description: Dashboard URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  FrontendBucketName:
    Description: Dashboard bucket
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: Distribution to invalidate after a frontend deploy
    Value: !Ref CloudFrontDistribution
  FindingsTableName:
    Value: !Ref FindingsTable
  ApprovalsTableName:
    Value: !Ref ApprovalsTable
  ConfigTableName:
    Value: !Ref ConfigTable
  JobsTableName:
    Value: !Ref JobsTable
  ActivityTableName:
    Value: !Ref ActivityTable
  PromptRegistryTableName:
    Value: !Ref PromptRegistryTable
  ScannerFunctionName:
    Value: !Ref ScannerFunction
  TeardownFunctionName:
    Value: !Ref TeardownFunction
